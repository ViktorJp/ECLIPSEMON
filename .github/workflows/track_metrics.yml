name: Track Release Downloads

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  snapshot-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository (main branch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests pandas

      - name: Fetch Existing Metrics Data
        run: |
          # Pull down existing metrics CSV if the metrics branch already has data
          mkdir -p metrics
          git checkout origin/metrics -- metrics/release_downloads.csv 2>/dev/null || true

      - name: Run Tracker
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python track_downloads.py

      - name: Push Metrics to Metrics Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Temporarily switch to metrics branch, apply the new CSV, and push
          git checkout metrics
          git add metrics/release_downloads.csv
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "Update download counts [skip ci]"
            git push origin metrics
          else
            echo "No changes in download counts."
          fi
